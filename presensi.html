<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi - SMAN 1 Batudaa Pantai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Pustaka untuk Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-warning shadow-sm">
        <div class="container">
            <a class="navbar-brand text-dark fw-bold" href="index.html">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4 hidden" id="kontenPresensi">
        <div class="row">
            <!-- Kolom Form Presensi -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm border-warning">
                    <div class="card-header bg-warning text-dark fw-bold">
                        Input Presensi Harian
                    </div>
                    <div class="card-body">
                        <form id="formPresensi">
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label text-sm">Tanggal</label>
                                    <input type="date" class="form-control border-warning" id="presensiTanggal" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-sm">Kelas</label>
                                    <select class="form-select border-warning" id="presensiKelas" required>
                                        <option value="">Pilih Kelas...</option>
                                        <option value="X - A (Informatika)">X - A (Informatika)</option>
                                        <option value="X - B (Informatika)">X - B (Informatika)</option>
                                        <option value="XI (Fisika)">XI (Fisika)</option>
                                        <option value="XII (Fisika)">XII (Fisika)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-sm">Materi Singkat</label>
                                <input type="text" class="form-control" id="presensiMateri" placeholder="Cth: Gerak Melingkar" required>
                            </div>
                            
                            <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                                <table class="table table-sm table-bordered text-sm">
                                    <thead class="table-light sticky-top">
                                        <tr>
                                            <th>Nama Siswa</th>
                                            <th style="width: 100px;">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="wadahDaftarSiswa">
                                        <tr><td colspan="2" class="text-center text-muted">Pilih kelas untuk memunculkan nama.</td></tr>
                                    </tbody>
                                </table>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold text-dark mt-3" id="btnSimpanPresensi">Simpan Presensi</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Kolom Rekap Presensi -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                            <h5 class="mb-0 fw-bold text-warning">Rekap Presensi</h5>
                            <div class="mt-2 mt-md-0">
                                <button class="btn btn-sm btn-success fw-bold me-1" id="btnExportPresensiExcel">⬇ Excel</button>
                                <button class="btn btn-sm btn-danger fw-bold" id="btnExportPresensiPDF">⬇ PDF</button>
                            </div>
                        </div>
                        <div class="table-responsive" id="areaCetakPresensi">
                            <table class="table table-bordered table-striped text-center text-sm" id="tabelExportPresensi">
                                <thead class="table-light align-middle">
                                    <tr>
                                        <th>Tanggal</th>
                                        <th>Kelas</th>
                                        <th>Materi</th>
                                        <th class="text-success">H</th>
                                        <th class="text-primary">S</th>
                                        <th class="text-warning">I</th>
                                        <th class="text-danger">A</th>
                                        <th class="kolom-aksi-presensi">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelPresensiData">
                                    <!-- Data dimuat dari Firebase -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
