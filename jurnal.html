<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar - SMAN 1 Batudaa Pantai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4 hidden" id="kontenJurnal">
        <div class="row">
            <!-- Form Input Jurnal -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Isi Jurnal Baru</h5>
                    </div>
                    <div class="card-body">
                        <form id="formJurnal">
                            <div class="mb-2">
                                <label class="form-label text-sm">Tanggal</label>
                                <input type="date" class="form-control" id="jurnalTanggal" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Kelas</label>
                                <select class="form-select" id="jurnalKelas" required>
                                    <option value="">Pilih Kelas...</option>
                                    <option value="X">Kelas X</option>
                                    <option value="XI">Kelas XI</option>
                                    <option value="XII">Kelas XII</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Materi Pokok</label>
                                <input type="text" class="form-control" id="jurnalMateri" placeholder="Cth: Gerak Dua Dimensi" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Siswa Absen/Keterangan</label>
                                <textarea class="form-control" id="jurnalKeterangan" rows="2" placeholder="Nihil, atau sebutkan nama siswa..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btnSimpanJurnal">Simpan Jurnal</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabel Rekap Jurnal -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">Rekap Jurnal Mengajar</h5>
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tanggal</th>
                                        <th>Kelas</th>
                                        <th>Materi</th>
                                        <th>Keterangan</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelJurnalData">
                                    <!-- Data akan dimuat dari Firebase ke sini -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
