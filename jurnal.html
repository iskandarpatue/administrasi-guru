<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar - SMAN 1 Batudaa Pantai</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Pustaka untuk Export ke Excel & PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="index.html">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4 hidden" id="kontenJurnal">
        <div class="row">
            <!-- Form Input Jurnal -->
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white fw-bold">
                        Input / Edit Jurnal
                    </div>
                    <div class="card-body">
                        <form id="formJurnal">
                            <!-- ID Tersembunyi untuk fitur Edit -->
                            <input type="hidden" id="editJurnalId" value="">
                            
                            <div class="mb-2">
                                <label class="form-label text-sm fw-bold">Tanggal</label>
                                <input type="date" class="form-control border-primary" id="jurnalTanggal" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-sm">Kelas</label>
                                <select class="form-select border-primary" id="jurnalKelas" required>
                                    <option value="">Pilih...</option>
                                    <option value="X - A">X - A</option>
                                    <option value="X - B">X - B</option>
                                    <option value="XI">XI</option>
                                    <option value="XII">XII</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-sm">Mata Pelajaran</label>
                                <select class="form-select border-primary" id="jurnalMapel" required>
                                    <option value="">Pilih...</option>
                                    <option value="Fisika">Fisika</option>
                                    <option value="Informatika">Informatika</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-sm">Materi Pokok / TP</label>
                                <input type="text" class="form-control" id="jurnalMateri" placeholder="Cth: Gerak Dua Dimensi" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-sm">Siswa Absen/Keterangan</label>
                                <textarea class="form-control" id="jurnalKeterangan" rows="2" placeholder="Cth: Nihil, atau sebut nama..."></textarea>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-sm">Kegiatan Pembelajaran</label>
                                <textarea class="form-control" id="jurnalKegiatan" rows="2" placeholder="Aktivitas di kelas..."></textarea>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-sm">Permasalahan</label>
                                <textarea class="form-control" id="jurnalMasalah" rows="2" placeholder="Kendala yang terjadi..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-sm">Rencana Tindak Lanjut</label>
                                <textarea class="form-control" id="jurnalTindakLanjut" rows="2" placeholder="Langkah perbaikan..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnSimpanJurnal">Simpan Jurnal</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabel Rekap Jurnal -->
            <div class="col-md-9">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                            <h5 class="mb-0 fw-bold text-primary">Rekap Jurnal Mengajar</h5>
                            
                            <!-- Kontrol Filter Bulan & Export -->
                            <div class="mt-2 mt-md-0 d-flex gap-2 align-items-center">
                                <label class="text-sm fw-bold mb-0 text-muted d-none d-md-block">Bulan:</label>
                                <input type="month" id="filterBulanJurnal" class="form-control form-control-sm border-secondary" style="width: 140px;" title="Pilih Bulan Rekapan">
                                
                                <button class="btn btn-sm btn-success fw-bold" id="btnExportJurnalExcel">⬇ Excel</button>
                                <button class="btn btn-sm btn-danger fw-bold" id="btnExportJurnalPDF">⬇ PDF</button>
                            </div>
                        </div>
                        
                        <div class="table-responsive" id="areaCetakJurnal">
                            <table class="table table-bordered table-striped text-sm" style="font-size: 0.8rem;" id="tabelExportJurnal">
                                <thead class="table-light align-middle text-center">
                                    <tr>
                                        <th style="min-width: 80px;">Tanggal</th>
                                        <th>Kelas</th>
                                        <th>Mapel</th>
                                        <th>Materi Pokok</th>
                                        <th>Siswa Absen</th>
                                        <th>Kegiatan Pembelajaran</th>
                                        <th>Permasalahan</th>
                                        <th>Tindak Lanjut</th>
                                        <th class="kolom-aksi-jurnal">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelJurnalData">
                                    <!-- Data akan dimuat dari Firebase ke sini -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hubungkan Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
