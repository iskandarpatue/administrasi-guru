<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perangkat Pembelajaran - SMAN 1 Batudaa Pantai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4 hidden" id="kontenPerangkat">
        <div class="row">
            <!-- Form Input Link -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-success">
                    <div class="card-body">
                        <h5 class="mb-3">Tambah Perangkat Baru</h5>
                        <form id="formPerangkat">
                            <div class="mb-3">
                                <label class="form-label">Nama Dokumen</label>
                                <input type="text" class="form-control" id="namaFile" placeholder="Cth: Modul Ajar Fisika Sem 1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Link Google Drive</label>
                                <input type="url" class="form-control" id="linkDrive" placeholder="Paste link Drive di sini..." required>
                                <small class="text-muted">Pastikan akses link Drive sudah diatur ke 'Siapa saja yang memiliki link'.</small>
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="btnUploadFile">Simpan Data</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- List File Tersimpan -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">Arsip Perangkat Pembelajaran</h5>
                        <ul class="list-group" id="listPerangkat">
                            <!-- Link file akan dimuat dari Firebase ke sini -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
