<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian - SMAN 1 Batudaa Pantai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4 hidden" id="kontenPenilaian">
        <div class="row">
            <!-- Kolom Form Input -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white fw-bold">
                        Input Nilai Siswa
                    </div>
                    <div class="card-body">
                        <form id="formPenilaian">
                            <div class="mb-2">
                                <label class="form-label text-sm">Kelas & Mapel</label>
                                <select class="form-select" id="nilaiKelas" required>
                                    <option value="">Pilih...</option>
                                    <option value="X - A (Informatika)">X - A (Informatika)</option>
                                    <option value="X - B (Informatika)">X - B (Informatika)</option>
                                    <option value="XI (Fisika)">XI (Fisika)</option>
                                    <option value="XII (Fisika)">XII (Fisika)</option>
                                </select>
                            </div>
                            <div class="row mb-2">
                                <div class="col-8">
                                    <label class="form-label text-sm">Nama Peserta Didik</label>
                                    <input type="text" class="form-control" id="nilaiNama" required>
                                </div>
                                <div class="col-4">
                                    <label class="form-label text-sm">L/P</label>
                                    <select class="form-select" id="nilaiGender" required>
                                        <option value="L">L</option>
                                        <option value="P">P</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-sm fw-bold text-primary">Jenis Penilaian</label>
                                <select class="form-select border-primary bg-light" id="jenisPenilaian" required>
                                    <option value="Formatif">Formatif (Proses/Tugas)</option>
                                    <option value="Sumatif">Sumatif (Angka 0-100)</option>
                                </select>
                            </div>
                            
                            <!-- Input 7 TP -->
                            <label class="form-label text-sm">Capaian TP 1 - TP 7</label>
                            <div class="row g-2 mb-2">
                                <div class="col"><input type="text" class="form-control form-control-sm tp-input" id="tp1" placeholder="TP 1"></div>
                                <div class="col"><input type="text" class="form-control form-control-sm tp-input" id="tp2" placeholder="TP 2"></div>
                                <div class="col"><input type="text" class="form-control form-control-sm tp-input" id="tp3" placeholder="TP 3"></div>
                                <div class="col"><input type="text" class="form-control form-control-sm tp-input" id="tp4" placeholder="TP 4"></div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col"><input type="text" class="form-control form-control-sm tp-input" id="tp5" placeholder="TP 5"></div>
                                <div class="col"><input type="text" class="form-control form-control-sm tp-input" id="tp6" placeholder="TP 6"></div>
                                <div class="col"><input type="text" class="form-control form-control-sm tp-input" id="tp7" placeholder="TP 7"></div>
                            </div>

                            <div class="mb-3" id="grupCatatan">
                                <label class="form-label text-sm">Catatan / TP yang Perlu Ditindaklanjuti</label>
                                <textarea class="form-control" id="nilaiCatatan" rows="2" placeholder="Tulis catatan..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnSimpanNilai">Simpan Penilaian</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Kolom Tabel Data -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Rekap Penilaian</h5>
                            <select class="form-select form-select-sm w-auto border-secondary" id="filterJenisPenilaian">
                                <option value="Formatif">Lihat Tabel Formatif</option>
                                <option value="Sumatif">Lihat Tabel Sumatif</option>
                            </select>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped text-center text-sm" style="font-size: 0.85rem;">
                                <thead class="table-light align-middle" id="headerTabelNilai">
                                    <!-- Header akan berubah otomatis via JS -->
                                </thead>
                                <tbody id="tabelNilaiData">
                                    <!-- Data akan dimuat dari Firebase ke sini -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hubungkan Firebase (Ingat Type Module) -->
    <script type="module" src="app.js"></script>
</body>
</html>
