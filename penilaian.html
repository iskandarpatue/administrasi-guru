<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian - SMAN 1 Batudaa Pantai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Pustaka untuk Export ke Excel & PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
        <div class="container">
            <a class="navbar-brand text-dark fw-bold" href="index.html">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4 hidden" id="kontenPenilaian">
        <div class="row">
            <!-- Kolom Form Input -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-info">
                    <div class="card-header bg-info text-dark fw-bold">
                        Input / Edit Nilai Siswa
                    </div>
                    <div class="card-body">
                        <form id="formPenilaian">
                            <input type="hidden" id="editDocId" value="">
                            <div class="mb-2">
                                <label class="form-label text-sm">Kelas & Mapel</label>
                                <select class="form-select border-info" id="nilaiKelas" required>
                                    <option value="">Pilih...</option>
                                    <option value="X - A (Informatika)">X - A (Informatika)</option>
                                    <option value="X - B (Informatika)">X - B (Informatika)</option>
                                    <option value="XI (Fisika)">XI (Fisika)</option>
                                    <option value="XII (Fisika)">XII (Fisika)</option>
                                </select>
                            </div>
                            <div class="row mb-2">
                                <div class="col-8">
                                    <label class="form-label text-sm">Nama Peserta Didik</label>
                                    <select class="form-select border-info" id="nilaiNama" required>
                                        <option value="">-- Pilih Kelas Dulu --</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <label class="form-label text-sm">L/P</label>
                                    <input type="text" class="form-control bg-light text-center fw-bold" id="nilaiGender" readonly required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-sm fw-bold">Jenis Penilaian</label>
                                <select class="form-select bg-light" id="jenisPenilaian" required>
                                    <option value="Formatif">Formatif (Proses/Tugas)</option>
                                    <option value="Sumatif">Sumatif (Angka 0-100)</option>
                                </select>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mb-2 mt-3 p-2 bg-light border rounded">
                                <label class="form-label text-sm fw-bold mb-0">Jumlah TP (Capaian)</label>
                                <div class="input-group input-group-sm w-auto">
                                    <input type="number" class="form-control text-center fw-bold border-info" id="jumlahTP" value="7" min="1" max="20" style="width: 60px;">
                                </div>
                            </div>

                            <div class="row g-2 mb-3" id="wadahTP"></div>

                            <div class="mb-3" id="grupCatatan">
                                <label class="form-label text-sm">Catatan / Rencana Tindak Lanjut</label>
                                <textarea class="form-control" id="nilaiCatatan" rows="2" placeholder="Tulis catatan..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-info w-100 fw-bold text-dark" id="btnSimpanNilai">Simpan Penilaian</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Kolom Tabel Data -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                            <h5 class="mb-0 fw-bold text-info">Rekap Penilaian</h5>
                            <div class="mt-2 mt-md-0">
                                <!-- Tombol Export -->
                                <button class="btn btn-sm btn-success fw-bold me-1" id="btnExportExcel">⬇ Excel</button>
                                <button class="btn btn-sm btn-danger fw-bold me-2" id="btnExportPDF">⬇ PDF</button>
                                
                                <select class="form-select form-select-sm w-auto d-inline-block border-secondary" id="filterJenisPenilaian">
                                    <option value="Formatif">Formatif</option>
                                    <option value="Sumatif">Sumatif</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="table-responsive" id="areaCetakTabel">
                            <table class="table table-bordered table-striped text-center text-sm" style="font-size: 0.85rem;" id="tabelExport">
                                <thead class="table-light align-middle" id="headerTabelNilai"></thead>
                                <tbody id="tabelNilaiData"></tbody>
                            </table>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
